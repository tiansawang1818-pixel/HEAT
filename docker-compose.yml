name: heatshift

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-development}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEMO_MODE: ${DEMO_MODE:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Bangkok}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://heatshift:heatshift@postgres:5432/heatshift}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_REGION: ${S3_REGION:-ap-southeast-1}
  S3_BUCKET: ${S3_BUCKET:-heatshift-rasters}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-heatshift}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-heatshift-local-only}
  ADMIN_API_KEY: ${ADMIN_API_KEY:-local-admin-key-change-me}
  ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE:-local_key}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
  OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
  OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
  OIDC_ADMIN_ROLES: '${OIDC_ADMIN_ROLES:-["heatshift.admin"]}'
  OIDC_ALLOWED_ALGORITHMS: '${OIDC_ALLOWED_ALGORITHMS:-["RS256"]}'
  OIDC_JWKS_CACHE_SECONDS: ${OIDC_JWKS_CACHE_SECONDS:-3600}
  OIDC_HTTP_TIMEOUT_SECONDS: ${OIDC_HTTP_TIMEOUT_SECONDS:-5}
  OIDC_CLOCK_SKEW_SECONDS: ${OIDC_CLOCK_SKEW_SECONDS:-30}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
  RATE_LIMIT_OPTIMIZATION_PER_MINUTE: ${RATE_LIMIT_OPTIMIZATION_PER_MINUTE:-20}
  RATE_LIMIT_SCENARIO_PER_MINUTE: ${RATE_LIMIT_SCENARIO_PER_MINUTE:-30}
  RATE_LIMIT_FORECAST_PER_MINUTE: ${RATE_LIMIT_FORECAST_PER_MINUTE:-6}
  RATE_LIMIT_ASSISTANT_PER_MINUTE: ${RATE_LIMIT_ASSISTANT_PER_MINUTE:-30}
  RATE_LIMIT_ADMIN_PER_MINUTE: ${RATE_LIMIT_ADMIN_PER_MINUTE:-15}
  RATE_LIMIT_FAIL_CLOSED_ADMIN: ${RATE_LIMIT_FAIL_CLOSED_ADMIN:-true}
  ALLOW_FIXTURE_INGESTION: ${ALLOW_FIXTURE_INGESTION:-false}
  FIXTURE_ROOT: ${FIXTURE_ROOT:-/workspace/data/fixtures}
  CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
  GEE_PROJECT: ${GEE_PROJECT:-}
  HISTORICAL_INGESTION_ENABLED: ${HISTORICAL_INGESTION_ENABLED:-false}
  GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
  GEE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT:-}
  GEE_TILE_DESCRIPTOR_TTL_SECONDS: ${GEE_TILE_DESCRIPTOR_TTL_SECONDS:-3000}
  OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1/forecast}
  OVERPASS_API_URL: ${OVERPASS_API_URL:-https://overpass-api.de/api/interpreter}
  OVERPASS_TIMEOUT_SECONDS: ${OVERPASS_TIMEOUT_SECONDS:-120}
  OVERPASS_MAX_RESPONSE_BYTES: ${OVERPASS_MAX_RESPONSE_BYTES:-20000000}
  OVERPASS_MAX_ELEMENTS: ${OVERPASS_MAX_ELEMENTS:-20000}
  OVERPASS_GRID_DIVISIONS: ${OVERPASS_GRID_DIVISIONS:-2}
  WORLDPOP_API_BASE_URL: ${WORLDPOP_API_BASE_URL:-https://api.worldpop.org/v3}
  WORLDPOP_API_KEY: ${WORLDPOP_API_KEY:-}
  WORLDPOP_REFERENCE_YEAR: ${WORLDPOP_REFERENCE_YEAR:-}
  BMA_BOUNDARY_CATALOG_URL: ${BMA_BOUNDARY_CATALOG_URL:-https://data.bangkok.go.th/api/3/action/package_show}
  BMA_BOUNDARY_DATASET_ID: ${BMA_BOUNDARY_DATASET_ID:-e537025b-1cf6-4c5b-8e46-c2e976f13283}
  BMA_BOUNDARY_RESOURCE_ID: ${BMA_BOUNDARY_RESOURCE_ID:-d7be7e84-9d84-4595-bf8f-79b0bc01f1ae}
  BMA_BOUNDARY_MAX_DOWNLOAD_BYTES: ${BMA_BOUNDARY_MAX_DOWNLOAD_BYTES:-10000000}
  OSM_REPLICATION_STATE_URL: ${OSM_REPLICATION_STATE_URL:-https://planet.openstreetmap.org/replication/day/state.txt}
  SOURCE_REQUEST_TIMEOUT_SECONDS: ${SOURCE_REQUEST_TIMEOUT_SECONDS:-60}
  FORECAST_MIN_YEARS: ${FORECAST_MIN_YEARS:-5}
  FORECAST_MIN_AREAS: ${FORECAST_MIN_AREAS:-5}
  FORECAST_MIN_VALIDATION_SAMPLES: ${FORECAST_MIN_VALIDATION_SAMPLES:-20}
  FORECAST_MIN_BASELINE_IMPROVEMENT: ${FORECAST_MIN_BASELINE_IMPROVEMENT:-0.0}

x-api-base: &api-base
  build:
    context: .
    dockerfile: infra/docker/api.Dockerfile
  env_file:
    - path: .env
      required: false
  environment: *api-environment
  volumes:
    - ./data:/workspace/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heatshift}
      POSTGRES_USER: ${POSTGRES_USER:-heatshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heatshift}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-heatshift.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-heatshift}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-heatshift-local-only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-10-29T15-34-59Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/create-bucket.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-heatshift}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-heatshift-local-only}
      S3_BUCKET: ${S3_BUCKET:-heatshift-rasters}
    volumes:
      - ./infra/minio/create-bucket.sh:/init/create-bucket.sh:ro
    restart: "no"

  migrate:
    <<: *api-base
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *api-base
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    <<: *api-base
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    stop_grace_period: 30s

  dispatcher:
    <<: *api-base
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "control", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *api-base
    command: ["celery", "-A", "app.celery_config.beat_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-/styles/community-osm.json}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-/styles/community-osm.json}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
      BACKEND_INTERNAL_URL: http://api:8000
      API_INTERNAL_URL: http://api:8000
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-admin-key-change-me}
      ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE:-local_key}
      DASHBOARD_ADMIN_TOKEN: ${DASHBOARD_ADMIN_TOKEN:-local-dashboard-admin-change-me}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_RESOURCE: ${OIDC_RESOURCE:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_REDIS_URL: ${AUTH_REDIS_URL:-redis://redis:6379/2}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
