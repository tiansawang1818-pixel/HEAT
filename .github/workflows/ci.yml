name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "apps/web/AGENTS.md"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: pytest
        env:
          APP_ENV: test
          TEST_DATABASE_URL: "sqlite+pysqlite:///:memory:"
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          CELERY_TASK_ALWAYS_EAGER: "true"
          ADMIN_API_KEY: ci-only-key
          ALLOW_FIXTURE_INGESTION: "true"
          FIXTURE_ROOT: ${{ github.workspace }}/data/fixtures
      - run: pip install --upgrade pip pip-audit && pip-audit

  web:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HEATSHIFT_RUN_SESSION_TESTS: "true"
      AUTH_REDIS_URL: redis://127.0.0.1:6379/2
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_DEMO_MODE: "true"

  stack:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: heatshift_ci
          POSTGRES_USER: heatshift
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U heatshift -d heatshift_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://heatshift:isolated-ci-only@127.0.0.1:5432/heatshift_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      DEMO_MODE: "false"
      HEATSHIFT_RUN_STACK_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: pytest integration -v
      - name: Restore backup into a separate ephemeral database
        run: python ../../scripts/verify_backup_restore_ci.py
        env:
          POSTGIS_CI_CONTAINER: ${{ job.services.postgres.id }}

  arm64:
    timeout-minutes: 20
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build native ARM database and application images
        run: |
          test "$(uname -m)" = aarch64
          docker build -f infra/docker/postgis.Dockerfile -t heatshift-postgis:arm-ci .
          docker build -f infra/docker/api.Dockerfile -t heatshift-api:arm-ci .
          docker build -f infra/docker/caddy.Dockerfile -t heatshift-caddy:arm-ci .
          test "$(docker image inspect heatshift-postgis:arm-ci --format '{{.Architecture}}')" = arm64
          test "$(docker image inspect heatshift-api:arm-ci --format '{{.Architecture}}')" = arm64
      - name: Start isolated native ARM services without contacting providers
        run: |
          docker run -d --name heatshift-arm-postgres -e POSTGRES_DB=heatshift_ci -e POSTGRES_USER=heatshift -e POSTGRES_PASSWORD=isolated-arm-ci-only -p 127.0.0.1:5432:5432 heatshift-postgis:arm-ci
          docker run -d --name heatshift-arm-redis -p 127.0.0.1:6379:6379 redis:7.4-alpine
          # initdb's temporary server accepts Unix sockets before extensions finish.
          # Only the final server listens on TCP, so do not admit that bootstrap server.
          for attempt in $(seq 1 60); do docker exec heatshift-arm-postgres pg_isready -h 127.0.0.1 -U heatshift -d heatshift_ci && break; sleep 1; done
          docker exec heatshift-arm-postgres psql -U heatshift -d heatshift_ci -c 'SELECT PostGIS_Full_Version()'
      - name: Verify migrations, spatial queries, real queue and scheduler on ARM
        run: |
          docker run --rm --network host -e ENVIRONMENT=test -e DEMO_MODE=false -e DATABASE_URL=postgresql+psycopg://heatshift:isolated-arm-ci-only@127.0.0.1:5432/heatshift_ci -e REDIS_URL=redis://127.0.0.1:6379/0 -e HEATSHIFT_RUN_STACK_TESTS=true heatshift-api:arm-ci sh -c 'alembic upgrade head && pytest integration -v'
          docker run --rm -e HEATSHIFT_DOMAIN=heatshift.example.org -e ACME_EMAIL=operator@example.org -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/infra/caddy/routes.caddy:/etc/caddy/routes.caddy:ro" heatshift-caddy:arm-ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Native ARM diagnostics
        if: failure()
        run: docker logs --tail 80 heatshift-arm-postgres
      - name: Stop isolated native ARM services
        if: always()
        run: docker rm -f heatshift-arm-postgres heatshift-arm-redis || true

  containers:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    env:
      ALERTMANAGER_CONFIG_FILE: ./infra/ci/alertmanager.yml
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated configuration placeholders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          values = {
              'POSTGRES_PASSWORD': 'isolated-ci-password-not-for-production',
              'DATABASE_URL': 'postgresql+psycopg://heatshift:isolated-ci-password-not-for-production@postgres:5432/heatshift',
              'OIDC_CLIENT_ID': 'isolated-ci-client',
              'AUTH_SESSION_SECRET': 'isolated-ci-encryption-secret-not-for-production',
              'GEE_PROJECT': 'isolated-ci-config-only',
              'GEE_CREDENTIALS_FILE': '/tmp/heatshift-gee-ci.json',
              'NEXT_PUBLIC_MAP_STYLE_URL': 'https://tiles.example.org/style.json',
          }
          lines = []
          for line in Path('.env.production.example').read_text().splitlines():
              key = line.split('=', 1)[0]
              lines.append(key + '=' + values[key] if key in values else line)
          Path('/tmp/heatshift-production-ci.env').write_text('\n'.join(lines) + '\n')
          Path('/tmp/heatshift-gee-ci.json').write_text('{}')
          PY
      - name: Verify production isolation and configuration
        run: |
          docker compose --env-file /tmp/heatshift-production-ci.env -f docker-compose.yml -f docker-compose.production.yml config --format json | python3 scripts/check_compose_config.py
          docker compose --env-file /tmp/heatshift-production-ci.env -f docker-compose.yml -f docker-compose.production.yml build caddy
          docker run --rm -e HEATSHIFT_DOMAIN=heatshift.example.org -e ACME_EMAIL=operator@example.org -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/infra/caddy/routes.caddy:/etc/caddy/routes.caddy:ro" heatshift-caddy:2.11.9 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build and start release containers without source monitors
        run: docker compose --env-file /tmp/heatshift-production-ci.env -f docker-compose.yml -f docker-compose.production.yml -f infra/ci/docker-compose.smoke.yml up -d --build --wait --wait-timeout 180 api web caddy
      - name: Read the disposable CI public CA certificate
        run: |
          docker compose --env-file /tmp/heatshift-production-ci.env -f docker-compose.yml -f docker-compose.production.yml -f infra/ci/docker-compose.smoke.yml exec -T caddy sh -c 'for attempt in $(seq 1 20); do test -s /data/caddy/pki/authorities/local/root.crt && exit 0; sleep 1; done; exit 1'
          docker compose --env-file /tmp/heatshift-production-ci.env -f docker-compose.yml -f docker-compose.production.yml -f infra/ci/docker-compose.smoke.yml exec -T caddy cat /data/caddy/pki/authorities/local/root.crt > /tmp/heatshift-ci-ca.pem
      - name: Verify TLS, pages, admin gates, cookie security and SSE
        run: |
          python3 scripts/verify_container_routes.py --url https://localhost:18443 --ca-file /tmp/heatshift-ci-ca.pem
          docker compose --env-file /tmp/heatshift-production-ci.env -f docker-compose.yml -f docker-compose.production.yml -f infra/ci/docker-compose.smoke.yml exec -T web node -e "fetch('http://127.0.0.1:3000/api/health').then(async r=>{if(!r.ok || (await r.json()).status!=='ok')process.exit(1)}).catch(()=>process.exit(1))"
          docker compose --env-file /tmp/heatshift-production-ci.env -f docker-compose.yml -f docker-compose.production.yml -f infra/ci/docker-compose.smoke.yml exec -T web node --input-type=module < scripts/check_web_stream.mjs
      - name: Verify incomplete real data keeps the release audit blocked
        run: |
          set +e
          python3 scripts/verify_release.py --url https://localhost:18443 --ca-file /tmp/heatshift-ci-ca.pem --output /tmp/heatshift-release-audit.json
          heatshift_audit_status=$?
          set -e
          test "$heatshift_audit_status" -eq 2
      - name: Bounded read-only latency smoke
        run: python3 scripts/load_smoke.py --url https://localhost:18443 --ca-file /tmp/heatshift-ci-ca.pem --requests 60 --concurrency 4 --output /tmp/heatshift-load-smoke.json
      - name: Execute the production backup helper against release containers
        env:
          HEATSHIFT_COMPOSE_ENV: production
          HEATSHIFT_COMPOSE_ENV_FILE: /tmp/heatshift-production-ci.env
          BACKUP_DIR: /tmp/heatshift-backups-ci
        run: |
          ./scripts/backup_postgres.sh
          for heatshift_checksum in /tmp/heatshift-backups-ci/*.sha256; do sha256sum -c "$heatshift_checksum"; done
      - name: Verify encrypted backup and download recovery in isolated storage
        env:
          HEATSHIFT_COMPOSE_ENV: production
          HEATSHIFT_COMPOSE_ENV_FILE: /tmp/heatshift-production-ci.env
          ENVIRONMENT: test
          RESTIC_REPOSITORY: /tmp/heatshift-restic-ci
          RESTIC_PASSWORD_FILE: /tmp/heatshift-restic-ci-password
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends restic
          umask 077
          python3 scripts/backup_offsite.py --prepare-password-file "$RESTIC_PASSWORD_FILE"
          restic init --json > /dev/null
          python3 scripts/backup_offsite.py --allow-local-test > /tmp/heatshift-offsite-backup.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/heatshift-offsite-backup.json'))
          assert report['status'] == 'verified' and report['download_checksum_matches'] and report['archive_readable']
          assert report['scope'] == 'isolated_local_repository_test' and not report['physical_offsite_location_verified']
          print('Encrypted snapshot restored; SHA-256 matches and PostgreSQL archive is readable. Local CI storage only.')
          PY
      - name: Verify alert rules and internal notification delivery
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/infra/monitoring:/etc/prometheus:ro" prom/prometheus:v3.15.1 test rules /etc/prometheus/alerts.test.yml
          docker compose --env-file /tmp/heatshift-production-ci.env -f docker-compose.yml -f docker-compose.production.yml -f infra/ci/docker-compose.smoke.yml -f docker-compose.monitoring.yml -f infra/ci/docker-compose.alerting.yml up -d --wait --wait-timeout 90 alert-test-receiver alertmanager prometheus
          docker compose --env-file /tmp/heatshift-production-ci.env -f docker-compose.yml -f docker-compose.production.yml -f infra/ci/docker-compose.smoke.yml -f docker-compose.monitoring.yml -f infra/ci/docker-compose.alerting.yml exec -T alertmanager amtool --alertmanager.url=http://127.0.0.1:9093 alert add alertname=HeatShiftNotificationSelfTest severity=warning
          python3 - <<'PY'
          import json, time, urllib.request
          deadline = time.monotonic() + 20
          while time.monotonic() < deadline:
              with urllib.request.urlopen('http://127.0.0.1:18081/status', timeout=3) as response:
                  names = json.load(response)['alert_names']
              if 'HeatShiftNotificationSelfTest' in names:
                  print('Alertmanager delivered the synthetic test alert to the isolated CI receiver.')
                  break
              time.sleep(.25)
          else:
              raise AssertionError('No test alert reached the local receiver')
          PY
      - name: Profile full runtime without external source checks
        run: |
          docker compose --env-file /tmp/heatshift-production-ci.env -f docker-compose.yml -f docker-compose.production.yml -f infra/ci/docker-compose.smoke.yml exec -T api python - <<'PY'
          import os
          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models.entities import DataSource
          from app.services.bootstrap import ensure_sources
          # This is the disposable release-test DB. Freeze provider checks
          # before starting Beat; never use production/provider credentials.
          with SessionLocal() as database:
              ensure_sources(database)
              for source in database.scalars(select(DataSource)).all():
                  source.enabled = False
              database.commit()
          PY
          docker compose --env-file /tmp/heatshift-production-ci.env -f docker-compose.yml -f docker-compose.production.yml -f infra/ci/docker-compose.smoke.yml up -d --wait --wait-timeout 90 worker dispatcher beat
          python3 scripts/profile_compose_capacity.py --env-file /tmp/heatshift-production-ci.env --ca-file /tmp/heatshift-ci-ca.pem --output /tmp/heatshift-capacity-profile.json
          docker compose --env-file /tmp/heatshift-production-ci.env -f docker-compose.yml -f docker-compose.production.yml -f infra/ci/docker-compose.smoke.yml exec -T api python - <<'PY'
          from sqlalchemy import func, select
          from app.db.session import SessionLocal
          from app.models.entities import SourceCheck
          with SessionLocal() as database:
              assert database.scalar(select(func.count()).select_from(SourceCheck)) == 0, 'Unexpected external source check during baseline profile'
          PY
      - name: Verify combined Hostless runtime under the proposed free cap
        run: python3 scripts/verify_hostless_runtime_ci.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification-reports
          path: |
            /tmp/heatshift-release-audit.json
            /tmp/heatshift-load-smoke.json
            /tmp/heatshift-offsite-backup.json
            /tmp/heatshift-capacity-profile.json
            /tmp/heatshift-hostless-runtime-ci.json
          retention-days: 14
      - name: Container diagnostics
        if: failure()
        run: docker compose --env-file /tmp/heatshift-production-ci.env -f docker-compose.yml -f docker-compose.production.yml -f infra/ci/docker-compose.smoke.yml logs --tail 80 api web migrate caddy
      - name: Stop ephemeral containers
        if: always()
        run: docker compose --env-file /tmp/heatshift-production-ci.env -f docker-compose.yml -f docker-compose.production.yml -f infra/ci/docker-compose.smoke.yml -f docker-compose.monitoring.yml -f infra/ci/docker-compose.alerting.yml down --volumes --remove-orphans
