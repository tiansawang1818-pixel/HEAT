name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: pytest
        env:
          APP_ENV: test
          TEST_DATABASE_URL: "sqlite+pysqlite:///:memory:"
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          CELERY_TASK_ALWAYS_EAGER: "true"
          ADMIN_API_KEY: ci-only-key
          ALLOW_FIXTURE_INGESTION: "true"
          FIXTURE_ROOT: ${{ github.workspace }}/data/fixtures

  web:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_DEMO_MODE: "true"

  stack:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: heatshift_ci
          POSTGRES_USER: heatshift
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heatshift -d heatshift_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://heatshift:isolated-ci-only@127.0.0.1:5432/heatshift_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      DEMO_MODE: "false"
      HEATSHIFT_RUN_STACK_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: pytest integration -v
