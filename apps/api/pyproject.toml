[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heat-shift-api"
version = "0.1.0"
description = "HEAT//SHIFT geospatial intelligence API"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "geoalchemy2>=0.15,<1",
  "shapely>=2.0,<3",
  "earthengine-api>=1.1,<2",
  "pyshp>=2.3,<3",
  "pyproj>=3.6,<4",
  "alembic>=1.13,<2",
  "celery[redis]>=5.6.3,<5.7",
  "redis>=6.1,<7",
  "httpx>=0.27,<1",
  "orjson>=3.10,<4",
  "ortools>=9.11,<10",
]

[project.optional-dependencies]
geo = [
  "geopandas>=1.0,<2",
  "rasterio>=1.4,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "xarray>=2024.9",
  "scikit-learn>=1.5,<2",
]
test = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
